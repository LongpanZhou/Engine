name: driver-compile

# Compiles and links Driver.sys against the real WDK libraries on a Windows runner.
# Runs only on this branch while the setup is being tested.
on:
  push:
    branches: [ci/wdk-compile]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Ninja
        run: choco install llvm ninja -y --no-progress

      # The WDK kernel libraries come from the Microsoft.Windows.WDK.x64 NuGet package, so no installer runs.
      # Only the .lib files are needed: the driver builds against the vendor's own headers.
      - name: Get WDK kernel libraries
        shell: pwsh
        run: |
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/10.0.26100.6584/microsoft.windows.wdk.x64.10.0.26100.6584.nupkg"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wdk.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wdk.zip" -DestinationPath "$env:RUNNER_TEMP\wdk"
          $libs = "$env:RUNNER_TEMP\wdk\c\Lib\10.0.26100.0\km\x64"
          if (-not (Test-Path "$libs\ntoskrnl.lib")) { throw "ntoskrnl.lib not found in $libs" }
          "WDK_LIB_PATH=$libs" >> $env:GITHUB_ENV

      - name: Check toolchain
        run: where.exe clang++ lld-link ninja

      - name: Configure
        run: >
          cmake -S Driver -B build -G Ninja
          -DWDK_LIB_PATH=$env:WDK_LIB_PATH
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc
          -DCMAKE_LINKER=lld-link

      - name: Build Driver.sys
        run: cmake --build build --target Driver --verbose
